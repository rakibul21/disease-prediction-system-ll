name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tests (each service has its own SQLite file)
        run: python -m unittest discover -s tests -v

  test-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: disease
          POSTGRES_PASSWORD: disease
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U disease"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt psycopg2-binary
      - name: Tests (auth and history services on PostgreSQL)
        env:
          TEST_PG_URL: postgresql://disease:disease@localhost:5432
        run: python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    needs: [test-sqlite, test-postgres]
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@v4
      - name: Build the four images and start the whole system
        run: docker compose up -d --build
      - name: Smoke test through the gateway
        run: python3 scripts/smoke_test.py http://localhost:5000
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
