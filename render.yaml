# Render.com blueprint: web service + managed PostgreSQL (free tiers may change).
services:
  - type: web
    name: disease-prediction-system
    runtime: docker
    dockerContext: ./implementation
    dockerfilePath: ./implementation/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: disease-db
          property: connectionString

databases:
  - name: disease-db
    plan: free
