name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: disease
          POSTGRES_PASSWORD: disease
          POSTGRES_DB: disease
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U disease"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-cloud.txt
      - name: Tests on SQLite
        run: python -m unittest discover -s tests -v
      - name: Tests on PostgreSQL
        env:
          DATABASE_URL: postgresql://disease:disease@localhost:5432/disease
        run: python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t disease-prediction-system implementation
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 5000:5000 -e SECRET_KEY=ci-secret disease-prediction-system
          for i in $(seq 1 20); do
            curl -fs http://localhost:5000/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1
